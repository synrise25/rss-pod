<!doctype html>
<html lang="en" data-style="silver" data-appearance="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f1ed" />
    <meta name="color-scheme" content="light" />
    <title>Commute Podcasts</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/themes.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div class="header-heading-row">
          <h1 id="greeting">What's worth a listen?</h1>
          <div class="header-actions">
            <button id="theme-button" class="theme-button header-button" type="button" aria-controls="theme-dialog" aria-haspopup="dialog" aria-expanded="false" data-theme-copy="button">Theme</button>
            <nav id="language-switcher" class="language-switcher" aria-label="Language">
              <a href="/en" data-locale="en" aria-current="page">EN</a>
              <a href="/zh-cn" data-locale="zh-CN">中文</a>
            </nav>
            <a
              id="github-link"
              class="github-link"
              href="https://github.com/synrise25/rss-pod"
              target="_blank"
              rel="noreferrer"
              aria-label="View project on GitHub"
              title="View project on GitHub"
            >
              <img src="/icons/github.svg" alt="" />
            </a>
          </div>
        </div>
        <section id="notice-region" class="notice-region" aria-label="Notice" hidden>
          <button id="notice-dismiss" class="notice-dismiss" type="button" aria-label="Dismiss notice" title="Dismiss notice">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6 18 18M18 6 6 18"></path>
            </svg>
          </button>
          <div id="notice-content" class="notice-content"></div>
        </section>
        <nav id="date-tabs" class="date-tabs" aria-label="Choose a date" tabindex="-1"></nav>
      </header>

      <section id="source-filter-section" class="source-filter-section" aria-label="Filter by source">
        <span id="source-filter-label" class="source-filter-label">Feeds</span>
        <div id="source-filters" class="source-filters"></div>
      </section>

      <section id="episode-region" class="episode-region" aria-label="Podcast episodes">
        <p id="status-message" class="status-message" role="status" aria-live="polite">Loading podcasts…</p>
        <div id="episode-list" class="episode-list" role="list"></div>
      </section>

      <section id="player-dock" class="player-dock" aria-label="Player">
        <div class="transport-controls">
          <button id="play-toggle" class="icon-button icon-button-primary" type="button" aria-label="Play" disabled>
            <img id="play-toggle-icon" src="/icons/play.svg" alt="" />
          </button>
          <button id="previous-button" class="icon-button icon-button-secondary" type="button" aria-label="Previous episode" disabled>
            <img src="/icons/previous.svg" alt="" />
          </button>
          <button id="next-button" class="icon-button icon-button-secondary" type="button" aria-label="Next episode" disabled>
            <img src="/icons/next.svg" alt="" />
          </button>
        </div>

        <div class="now-playing">
          <p class="now-playing-label">
            <span id="now-playing-label">PLAYING</span><span id="now-playing-source" class="now-playing-source"></span>
          </p>
          <p id="now-playing-title" class="now-playing-title">Choose an episode</p>
          <div class="progress-row">
            <input
              id="progress"
              class="progress"
              type="range"
              min="0"
              max="100"
              step="0.1"
              value="0"
              aria-label="Playback progress"
              disabled
            />
            <div class="time-readout" aria-live="off">
              <span id="elapsed-time">0:00</span>
              <span id="remaining-time">--:--</span>
            </div>
          </div>
        </div>

        <div class="speed-panel">
          <span id="speed-label" class="speed-label">Speed</span>
          <fieldset class="speed-control">
            <legend id="speed-legend" class="visually-hidden">Playback speed</legend>
            <button type="button" data-speed="1">1.0×</button>
            <button type="button" data-speed="1.2">1.2×</button>
            <button type="button" data-speed="1.5">1.5×</button>
          </fieldset>
        </div>

        <audio id="audio" preload="metadata"></audio>
      </section>
    </main>

    <div id="theme-dialog" class="theme-dialog" hidden>
      <section class="theme-panel" role="dialog" aria-modal="true" aria-labelledby="theme-title">
        <div class="theme-panel-heading">
          <h2 id="theme-title" data-theme-copy="title">Appearance</h2>
          <button id="theme-close" class="theme-close" type="button" data-theme-copy="close">Done</button>
        </div>
        <fieldset class="theme-options">
          <legend data-theme-copy="style">Style</legend>
          <div class="theme-choices">
            <label>
              <input class="visually-hidden" type="radio" name="theme-style" value="silver" checked />
              <span class="theme-choice">
                <span class="theme-swatch" data-swatch="silver" aria-hidden="true"><i></i><i></i><i></i></span>
                <span data-theme-copy="silver">Silver Signal</span>
              </span>
            </label>
            <label>
              <input class="visually-hidden" type="radio" name="theme-style" value="crystal" />
              <span class="theme-choice">
                <span class="theme-swatch" data-swatch="crystal" aria-hidden="true"><i></i><i></i><i></i></span>
                <span data-theme-copy="crystal">Smoked Crystal</span>
              </span>
            </label>
            <label>
              <input class="visually-hidden" type="radio" name="theme-style" value="glacier" />
              <span class="theme-choice">
                <span class="theme-swatch" data-swatch="glacier" aria-hidden="true"><i></i><i></i><i></i></span>
                <span data-theme-copy="glacier">Glacier · Original</span>
              </span>
            </label>
          </div>
        </fieldset>
        <fieldset class="theme-options">
          <legend data-theme-copy="mode">Day & night</legend>
          <div class="theme-choices theme-mode-choices">
            <label><input class="visually-hidden" type="radio" name="theme-mode" value="day" checked /><span class="theme-choice" data-theme-copy="day">Day</span></label>
            <label><input class="visually-hidden" type="radio" name="theme-mode" value="night" /><span class="theme-choice" data-theme-copy="night">Night</span></label>
            <label><input class="visually-hidden" type="radio" name="theme-mode" value="auto" /><span class="theme-choice" data-theme-copy="auto">System</span></label>
          </div>
        </fieldset>
      </section>
    </div>

    <template id="episode-row-template">
      <article class="episode-row" role="listitem">
        <button class="episode-play-button" type="button">
          <img src="/icons/play.svg" alt="" />
        </button>
        <span class="episode-source"></span>
        <h2 class="episode-title"></h2>
        <time class="episode-time"></time>
      </article>
    </template>
  </body>
</html>
